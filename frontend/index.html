<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5f7; color: #16181d;
  }
  .card {
    width: min(360px, 90vw); padding: 32px;
    background: #fff; border: 1px solid #e3e5ea; border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  h1 { margin: 0 0 24px; font-size: 20px; }
  label { display: block; margin-bottom: 6px; font-size: 13px; color: #5b616e; }
  input {
    width: 100%; box-sizing: border-box; padding: 9px 11px; margin-bottom: 16px;
    font: inherit; border: 1px solid #d3d6dd; border-radius: 6px; background: #fff; color: inherit;
  }
  input:focus { outline: 2px solid #4a6cf7; outline-offset: -1px; border-color: transparent; }
  button {
    width: 100%; padding: 10px; font: inherit; font-weight: 600;
    color: #fff; background: #4a6cf7; border: 0; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #3a5ae0; }
  .status { margin-top: 16px; font-size: 13px; color: #5b616e; min-height: 1.5em; }
  .status.err { color: #c02a2a; }
  .status.ok { color: #15803d; font-weight: 600; }

  /* Traditional CAPTCHA Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    place-items: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.active {
    display: grid;
  }
  .captcha-box {
    width: min(380px, 92vw);
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    border: 1px solid #e2e8f0;
  }
  .captcha-box h2 {
    margin: 0 0 8px;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .captcha-box p {
    margin: 0 0 16px;
    font-size: 13px;
    color: #64748b;
  }
  .captcha-display {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  canvas#captcha-canvas {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
  }
  .reload-btn {
    width: auto;
    padding: 8px 12px;
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
    font-size: 13px;
  }
  .reload-btn:hover {
    background: #e2e8f0;
  }
  .captcha-error {
    margin-top: -8px;
    margin-bottom: 12px;
    font-size: 12px;
    color: #dc2626;
    display: none;
  }
  .captcha-actions {
    display: flex;
    gap: 10px;
  }
  .btn-secondary {
    background: #e2e8f0;
    color: #334155;
  }
  .btn-secondary:hover {
    background: #cbd5e1;
  }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>Sign in</h1>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="off" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="off" required>

    <button type="submit" id="submit-btn">Sign in</button>
    <p class="status" id="status">Buffered events: <span id="count">0</span></p>
  </form>

  <!-- Traditional CAPTCHA Modal -->
  <div class="modal-overlay" id="captcha-modal">
    <div class="captcha-box" id="captcha-card">
      <h2>Security Verification</h2>
      <p>Please enter the characters shown below to complete your sign in.</p>
      
      <div class="captcha-display">
        <canvas id="captcha-canvas" width="180" height="50"></canvas>
        <button type="button" class="reload-btn" id="reload-captcha-btn" title="Get a new challenge">New Code</button>
      </div>

      <label for="captcha-input">Enter characters</label>
      <input type="text" id="captcha-input" maxlength="6" autocomplete="off" placeholder="Type characters..." />
      <div class="captcha-error" id="captcha-error">Incorrect characters. Please try again.</div>

      <div class="captcha-actions">
        <button type="button" class="btn-secondary" id="cancel-captcha-btn">Cancel</button>
        <button type="button" id="verify-captcha-btn">Verify & Proceed</button>
      </div>
    </div>
  </div>

<script>
const ENDPOINT = "/api/telemetry/";
const SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

const buffer = [];
const countEl = document.getElementById("count");
const statusEl = document.getElementById("status");

// mousemove fires ~60x/sec; throttle it to ~20 samples/sec.
let lastMove = 0;
document.addEventListener("mousemove", (e) => {
  const now = Date.now();
  if (now - lastMove < 50) return;
  lastMove = now;
  record("move", e);
});

document.addEventListener("click", (e) => record("click", e));

function record(type, e) {
  buffer.push({
    session_id: SESSION_ID,
    event_type: type,
    x: e.clientX,
    y: e.clientY,
    ts: Date.now()          // client clock, epoch ms
  });
  countEl.textContent = buffer.length;
}

/* ---------------- CAPTCHA GENERATOR ---------------- */
let currentCaptchaCode = "";
const canvas = document.getElementById("captcha-canvas");
const ctx = canvas.getContext("2d");
const captchaModal = document.getElementById("captcha-modal");
const captchaInput = document.getElementById("captcha-input");
const captchaError = document.getElementById("captcha-error");

function generateCaptchaCode(length = 5) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // exclude easily confused chars (I, 1, O, 0)
  let result = "";
  for (let i = 0; i < length; i++) {
    result += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return result;
}

function renderCaptcha() {
  currentCaptchaCode = generateCaptchaCode();
  captchaInput.value = "";
  captchaError.style.display = "none";

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background noise pattern
  ctx.fillStyle = "#e2e8f0";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Noise lines
  for (let i = 0; i < 6; i++) {
    ctx.strokeStyle = `hsl(${Math.random() * 360}, 50%, 65%)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
    ctx.bezierCurveTo(
      Math.random() * canvas.width, Math.random() * canvas.height,
      Math.random() * canvas.width, Math.random() * canvas.height,
      Math.random() * canvas.width, Math.random() * canvas.height
    );
    ctx.stroke();
  }

  // Draw distorted characters
  for (let i = 0; i < currentCaptchaCode.length; i++) {
    const char = currentCaptchaCode[i];
    ctx.save();
    const x = 24 + i * 28;
    const y = 34 + (Math.random() * 6 - 3);
    const angle = (Math.random() * 0.4) - 0.2; // slight tilt

    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.font = `bold ${24 + Math.floor(Math.random() * 4)}px monospace`;
    ctx.fillStyle = `hsl(${Math.random() * 260}, 75%, 25%)`;
    ctx.fillText(char, 0, 0);
    ctx.restore();
  }

  // Noise dots
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = `rgba(100, 116, 139, ${Math.random() * 0.5})`;
    ctx.beginPath();
    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function showCaptchaModal() {
  renderCaptcha();
  captchaModal.classList.add("active");
  setTimeout(() => captchaInput.focus(), 50);
}

function hideCaptchaModal() {
  captchaModal.classList.remove("active");
}

document.getElementById("reload-captcha-btn").addEventListener("click", () => {
  renderCaptcha();
});

document.getElementById("cancel-captcha-btn").addEventListener("click", () => {
  hideCaptchaModal();
  setStatus("Sign in cancelled.");
});

// When user clicks "Sign in" on form, require CAPTCHA challenge
document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (buffer.length === 0) {
    setStatus("Move the pointer first to generate behavioural telemetry.", true);
    return;
  }
  showCaptchaModal();
});

// Verify traditional CAPTCHA and then flush telemetry buffer
document.getElementById("verify-captcha-btn").addEventListener("click", async () => {
  const entered = captchaInput.value.trim().toUpperCase();
  if (entered !== currentCaptchaCode) {
    captchaError.style.display = "block";
    captchaInput.select();
    return;
  }

  hideCaptchaModal();
  await flushTelemetry(true);
});

// Allow pressing Enter in captcha input field
captchaInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    document.getElementById("verify-captcha-btn").click();
  }
});

async function flushTelemetry(captchaPassed) {
  const batch = buffer.splice(0, buffer.length);
  countEl.textContent = 0;

  setStatus("Verifying CAPTCHA and transmitting " + batch.length + " telemetry events...");
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(batch)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
    setStatus("CAPTCHA Verified! Stored " + data.stored + " telemetry events. Session " + SESSION_ID.slice(0, 8), false, true);
  } catch (err) {
    buffer.unshift(...batch);            // requeue so nothing is lost
    countEl.textContent = buffer.length;
    setStatus("Send failed: " + err.message, true);
  }
}

function setStatus(msg, isError, isOk) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("err", !!isError);
  statusEl.classList.toggle("ok", !!isOk);
}
</script>
</body>
</html>
