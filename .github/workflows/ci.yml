name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks and migrations
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
      - name: Backend tests
        run: python backend/manage.py test tracker
      - name: Feature and model tests
        run: python -m unittest ml.tests
      - name: Dashboard, script, and edge tests
        run: python -m unittest discover -s tests
      - name: Collector tests
        run: node --test frontend/tests/*.test.js
      - name: Script syntax
        run: for script in scripts/bot_fleet.mjs scripts/browser_demo.mjs scripts/screenshots.mjs scripts/lib/cdp.mjs; do node --check "$script"; done
